    members_widget: Aktive Benutzer
    online_widget: Gerade online
    composer_example: Diskussion starten
    shoutbox_example: Nachrichtenbereich der Shoutbox · Beispiel
    discussion_example: Eine neue Idee für den Homeserver
    discussion_text: So wirken Abstand, Rundung und Farben im Feed.
    "experience": "Erlebnis"
    "journey": "Einstieg"
    "categories": "Kategorien"
    "experience_help": "Schalte die neuen Funktionen einzeln ein. Arbeitsplatz und Einstiegsschritte werden pro Konto in diesem Browser gespeichert. Den Werkzeugkasten füllst du über Projekte. Hinweise und Darstellungsarten richtest du unter Kategorien ein."
    "experience_preview": "Lesemodus und Werkzeugkasten werden im geöffneten Thema angezeigt."
    "journey_help": "Bis zu fünf Schritte. Titel und Zieladresse ausfüllen. Leere Einträge werden ausgeblendet. Die Mitglieder können die Schritte selbst abhaken."
    "categories_help": "Bis zu drei Regeln. Trage den Kategorie-Slug aus /t/slug ein. Die erste passende Regel gewinnt. Support nutzt FoF Best Answer, Anleitungen erhalten eine Übersicht der h2- und h3-Überschriften des geladenen ersten Beitrags, Software verwendet das zugeordnete Projekt. Hinweise erscheinen im Kategoriebereich und im Thema. Alle eingetragenen Texte sind öffentlich."
    "step_slot": "Schritt {slot}"
    "category_slot": "Regel {slot}"
    "footer": "Footer"
    "footer_help": "Infobereich, vier Linkspalten und vier Social-Links. Leere oder ungültige Links werden ausgeblendet. Für Symbole etwa fas fa-book oder fab fa-github verwenden. '{year}' und '{forum}' im Copyright werden automatisch ersetzt. Aktivierst du diesen Footer, deaktiviere einen anderen Footer wie Modern Footer separat. Der mobile Abstand ist manuell für eine feste untere Navigation einstellbar."
