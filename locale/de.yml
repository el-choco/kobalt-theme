    layout: Layout
    orbit_help: "Bis zu drei Ziele. Beispiele für die Adresse sind @index, @depot.index, @tags, downloads oder eine HTTPS-Adresse. Leere Adressen blenden den jeweiligen Link aus."
    stage_help: "Leere Überschriften verwenden die vorhandenen Forentexte. Die Fokus-Karte kann zu einem Thema, einer Seite oder einer externen Adresse führen."
    featured_help: "Die Karte erscheint auf der Startseite vor dem Feed. Für eine Diskussion kannst du die ID, den Slug oder den Link aus diesem Forum eingeben. Ein leerer Titel verwendet dann den Diskussionstitel."
    projects_help: "Bis zu drei Karten. Ein leerer Name blendet die Karte aus. Mit dem Depot-Slug aus der Download-Adresse lädt Kobalt die veröffentlichte Version automatisch. Ohne Depot-Slug gilt die eingetragene Version."
    community_help: "Die Besuchsübersicht gilt für angemeldete Mitglieder. Support-Filter benötigen FoF Best Answer und eine als Frage und Antwort konfigurierte Kategorie. Meine Themen benötigt FoF Follow Tags."
    project_slot: "Projekt {slot}"
    invalid_discussion: "Gib eine Diskussions-ID oder einen passenden Link ein, zum Beispiel 28 oder 28-serverlotse."
    featured_example: Titel der ausgewählten Diskussion
    example_label: Beispieldiskussion
    layout_help: "Die Widget-Platzierung bearbeitest du in FoF Widgets Core. Hier steuerst du ihre Darstellung im Theme."
